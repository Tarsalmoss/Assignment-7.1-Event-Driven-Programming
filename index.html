<!DOCTYPE html>
<html lang="en">

<head>

    <!-- Character encoding -->
    <meta charset="UTF-8">

    <!-- Mobile device support -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Page title -->
    <title>Meme Mover</title>

    <!-- Link CSS file -->
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Main heading -->
    <h1>Meme Moving Assignment</h1>

    <!-- Instructions -->
    <p>Press Start to move the meme. Press Stop to stop the meme.</p>

    <!-- Form required by assignment -->
    <form>

        <!-- Start button -->
        <button id="startButton" type="button">
            Start
        </button>

        <!-- Stop button -->
        <button id="stopButton" type="button" disabled>
            Stop
        </button>

    </form>

    <!-- Message area using innerHTML -->
    <div id="messageArea">
        Click Start to begin.
    </div>

    <!-- Meme image -->
    <img
        id="memeImage"
        src="https://i.imgflip.com/30b1gx.jpg"
        alt="Meme Image">

    <!-- Link JavaScript file -->
    <script src="code.js"></script>

</body>

</html>
